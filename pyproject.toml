[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "safety-eval"
version = "0.2.0b8"
description = "Automate NCDOT before/after safety evaluations from a TEAAS fiche and assignment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "openpyxl>=3.1",
    # Outlook .msg assignment emails (pure-python OLE reader, no transitive deps)
    "olefile>=0.46",
    # plotter-style stroke lettering on collision diagram sheets
    "Hershey-Fonts>=2.0",
]

[project.optional-dependencies]
# PDF / OCR front-end (any one of these enables the PDF input path)
pdf = ["pdfplumber>=0.11", "pypdf>=4.0"]
ocr = ["pytesseract>=0.3", "pdf2image>=1.17"]
ui = ["streamlit>=1.30", "Pillow>=10"]
# assumptions email deliverable
docx = ["python-docx>=1.1"]
# results page print, PDF binding, map block, QA checks
deliverables = ["pikepdf>=8", "Pillow>=10", "matplotlib>=3.7", "python-docx>=1.1"]
# assistant chat (docs/07 phase 5), official Anthropic SDK
llm = ["anthropic>=1.0"]
# the app in a native desktop window (python -m safety_eval.desktop);
# without it the launcher falls back to an Edge/Chrome app window
desktop = ["pywebview>=5.0"]
# package maps PDF printing (Chromium through Playwright); run
# "playwright install chromium" once after installing
maps = ["playwright>=1.40"]
# The recalc tests also need LibreOffice with Calc: the core package
# alone has no xlsx filter, so soffice reports "source file could
# not be loaded" and every recalc returns False.
dev = ["pytest>=7", "python-docx>=1.1"]

[project.scripts]
safety-eval = "safety_eval.cli:main"

[tool.setuptools.packages.find]
include = ["safety_eval*"]

[tool.setuptools.package-data]
safety_eval = ["config/*.yaml", "vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
