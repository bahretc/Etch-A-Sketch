items_for_discussion:
  - "No crashes occurred at the intersection during the construction period (4/1/2021 to 6/30/2021)."
  - "The only Class A injury crash (12/16/2017) was an eastbound SR 1617 driver who ran the STOP sign and struck the saddle fuel tank of a southbound truck-trailer on SR 1001; the truck ran off the road and came to rest in the front yard of a residence."
  - "The most severe after-period target crash (10/23/2025, Class C) was a westbound SR 1001 driver who failed to stop at the four-way stop and struck a northbound vehicle towing a trailer."
  - "Before conversion the side-street at-fault approaches split evenly: six eastbound on the SR 1617 leg and five westbound on the SR 1619 leg. The one after-period side-street at-fault target crash was eastbound on SR 1617. Three of the four after-period SR 1001 at-fault target crashes were northbound; the fourth was coded westbound."
  - "The single after-period rear-end (12/4/2024, Class C) struck a vehicle stopped at the all-way stop; rear-end frequency did not rise with the conversion (one before, one after, both queue crashes)."
